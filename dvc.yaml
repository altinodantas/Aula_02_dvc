stages:
  ingest:
    cmd: python src/ingest.py
    outs:
      - data/raw

  clean:
    cmd: python src/clean.py
    deps:
      - data/raw
    outs:
      - data/processed

  features:
    cmd: python src/features.py
    deps:
      - data/processed
    outs:
      - data/features

  train:
    cmd: python src/train.py
    deps:
      - data/features
    outs:
      - models/model.pkl